<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crypto RAG Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1 class="mb-4">CryptoSlate RAG Answer Engine</h1>
    <form action="/rag" method="GET" class="mb-4">
        <input class="form-control mb-2" type="text" name="query" placeholder="Enter your question..." value="{{ query }}">
        <button class="btn btn-primary" type="submit">Search & Generate</button>
    </form>

    {% if generated_answer %}
    <div class="card mb-4">
        <div class="card-header"><strong>Generated Answer</strong></div>
        <div class="card-body"><p>{{ generated_answer }}</p></div>
    </div>
    {% endif %}

    {% if search_results %}
    <h3>Top Retrieved Articles</h3>
    <div class="list-group">
        {% for result in search_results %}
        <a href="{{ result.url }}" target="_blank" class="list-group-item list-group-item-action">
            {{ result.title }}
        </a>
        {% endfor %}
    </div>
    {% endif %}
</body>
</html>
